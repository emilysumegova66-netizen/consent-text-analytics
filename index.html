<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Text Analytics Dashboard</title>
<style>body{font:15px system-ui,sans-serif;max-width:1000px;margin:40px auto;padding:0 18px;color:#222}input,button{font:inherit;padding:9px;margin:4px}button{cursor:pointer}.muted{color:#666}.panel{border:1px solid #ddd;border-radius:10px;padding:16px;margin:16px 0}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{text-align:left;border-bottom:1px solid #ddd;padding:9px}</style></head>
<body><h1>Text interaction dashboard</h1><p class="muted">Field labels and character counts only. Actual typed text is never collected.</p>
<section id="auth" class="panel"><h2>Sign in</h2><input id="email" type="email" placeholder="Email address" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="signin">Sign in</button><button id="signup">Create account</button><p id="authStatus" class="muted"></p></section>
<section id="app" hidden><div class="panel"><button id="signout">Sign out</button><h2>Create a tracking project</h2><input id="projectName" placeholder="Project name"><button id="createProject">Create project</button><p id="projectStatus" class="muted"></p><label for="projects">Your projects:</label><select id="projects"></select><button id="refresh">Refresh events</button><h3>Embed code</h3><textarea id="embed" rows="3" style="width:100%" readonly></textarea><button id="copy">Copy embed code</button></div>
<div class="panel"><h2>Recent text-field activity</h2><p id="summary" class="muted">Choose a project.</p><table><thead><tr><th>Time</th><th>Page</th><th>Field</th><th>Type</th><th>Characters</th></tr></thead><tbody id="events"></tbody></table></div></section>
<script>const SUPABASE_URL="https://mwhsrggqmzrlbnrnkgjs.supabase.co";const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13aHNyZ2dxbXpybGJucm5rZ2pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMDAzODMsImV4cCI6MjEwOTU3NjM4M30.rlQbSvZPnDIIvxcVOpVdjt-XUA7ZH_ON6V9KGlQJGYI";</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $=id=>document.getElementById(id);let sb,currentProjects=[];
function status(id,msg){$(id).textContent=msg}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
$("signin").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});status("authStatus",error?error.message:"Signed in.");await updateUI()};
$("signup").onclick=async()=>{const {error}=await sb.auth.signUp({email:$("email").value,password:$("password").value});status("authStatus",error?error.message:"Account request submitted. Check your email if confirmation is enabled.")};
$("signout").onclick=async()=>{await sb.auth.signOut();await updateUI()};$("createProject").onclick=createProject;$("projects").onchange=updateEmbed;$("refresh").onclick=loadEvents;
$("copy").onclick=async()=>{await navigator.clipboard.writeText($("embed").value);status("projectStatus","Embed code copied.")};sb.auth.onAuthStateChange(()=>updateUI());updateUI();
async function updateUI(){const {data:{session}}=await sb.auth.getSession();$("auth").hidden=!!session;$("app").hidden=!session;if(session)await loadProjects()}
async function loadProjects(){const {data,error}=await sb.from("tracking_projects").select("id,name,public_token").order("created_at",{ascending:false});if(error)return status("projectStatus",error.message);currentProjects=data||[];$("projects").innerHTML=currentProjects.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join("");updateEmbed();await loadEvents()}
async function createProject(){const name=$("projectName").value.trim();if(!name)return status("projectStatus","Enter a project name.");const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from("tracking_projects").insert({name,owner_id:user.id});if(error)return status("projectStatus",error.message);$("projectName").value="";status("projectStatus","Project created.");await loadProjects()}
function selectedProject(){return currentProjects.find(p=>p.id===$("projects").value)}
function updateEmbed(){const p=selectedProject();if(!p){$("embed").value="";return}const trackerUrl=new URL("tracker.js",location.href).href;$("embed").value='<script src="'+trackerUrl+'" data-project="'+p.public_token+'" data-supabase-url="'+SUPABASE_URL+'" data-anon-key="'+SUPABASE_ANON_KEY+'"><\/script>'}
async function loadEvents(){const p=selectedProject();if(!p){$("events").innerHTML="";$("summary").textContent="Create or choose a project.";return}const {data,error}=await sb.from("text_events").select("occurred_at,page_path,field_label,field_type,character_count").eq("project_token",p.public_token).order("occurred_at",{ascending:false}).limit(100);if(error)return status("summary",error.message);$("summary").textContent=data.length+" recent events (maximum 100 shown).";$("events").innerHTML=data.map(e=>"<tr><td>"+esc(new Date(e.occurred_at).toLocaleString())+"</td><td>"+esc(e.page_path)+"</td><td>"+esc(e.field_label)+"</td><td>"+esc(e.field_type)+"</td><td>"+e.character_count+"</td></tr>").join("")}
</script></body></html>
